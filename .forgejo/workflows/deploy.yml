name: Check & deploy

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: docker

    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test
        run: |
          npm run lint:check
          npm run format:check
          npm run typecheck
          npm run typecheck:e2e
          npm test

      - name: Test E2E
        run: |
          npm run test:e2e

      - name: Build
        run: |
          npm run build

      - name: Upload Playwright report
        if: failure()
        uses: https://github.com/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload static site artifact 1
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: pages-build-0
          path: dist
          if-no-files-found: error
          retention-days: 1
    if: ${{ github.actor != 'renovate-bot' && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.head_ref, 'renovate/') }}
  build-pages:
    name: Deploy static site artifacts
    needs: build
    if: ${{ github.actor != 'renovate-bot' && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.head_ref, 'renovate/') && ((github.event_name
      == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: pages
    container:
      image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
      volumes:
        - /pages/fleeting:/pages/fleeting
    concurrency:
      group: pages-deploy-fleeting-garden
      cancel-in-progress: false
    steps:
      - name: Download static site artifact 1
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: pages-build-0
          path: dist
      - name: Copy build to host pages mount
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: https://git.schmelczer.dev/andras/ci-actions/deploy-pages@18419c79a58572be1bb3759b334f43306be44a29
        with:
          source: dist
          target: fleeting
